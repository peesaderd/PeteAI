name: CI - Build, Test & Docker

on:
  push:
    branches: [master, erp-core]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [master, erp-core]

env:
  NODE_VERSION: "20"

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Generate coverage report
        run: npm test -- --coverage --reporter=lcov || true
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  typecheck:
    name: TypeScript Compilation
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: erp-core
            dockerfile: Dockerfile
          - name: knowledge-base
            dockerfile: Dockerfile.knowledge-base
          - name: sync-siyuan
            dockerfile: Dockerfile.sync-siyuan
          - name: task-manager
            dockerfile: Dockerfile.task-manager
          - name: ai-orchestrator
            context: packages/ai-orchestrator
            dockerfile: packages/ai-orchestrator/Dockerfile
          - name: system-agent
            context: packages/system-agent
            dockerfile: packages/system-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context || "." }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: erp-core/${{ matrix.service.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config

  notify-failure:
    name: Notify on Failure
    needs: [unit-tests, e2e-tests, typecheck, docker-build]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const workflowUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            const failedJobs = [
              { job: "unit-tests", result: "${{ needs.unit-tests.result }}" },
              { job: "e2e-tests", result: "${{ needs.e2e-tests.result }}" },
              { job: "typecheck", result: "${{ needs.typecheck.result }}" },
              { job: "docker-build", result: "${{ needs.docker-build.result }}" },
            ].filter(j => j.result === "failure").map(j => "- **" + j.job + "**").join("\\n");
            if (failedJobs) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "[CI] Test pipeline failed on ${{ github.ref_name }}",
                labels: ["bug", "test"],
                body: "## ❌ CI Pipeline Failure\\n\\n### Failed Jobs:\\n" + failedJobs + "\\n\\n### Workflow Run:\\n" + workflowUrl + "\\n\\n### Branch:\\n`${{ github.ref_name }}`\\n\\n### Commit:\\n${{ github.sha }}\\n\\n---\\n*Auto-created by CI pipeline*"
              });
            }
