name: CD - Deploy to Production

on:
  push:
    branches: [erp-core]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (all, erp-core, knowledge-base, sync-siyuan, task-manager, ai-orchestrator)"
        required: true
        default: "all"

env:
  NODE_VERSION: "20"
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || "root" }}
  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || "/root/erp-core" }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}/erp-core
            echo "Pulling latest code..."
            git pull origin erp-core
            echo "Rebuilding and restarting services..."
            docker compose pull
            docker compose up -d --build --force-recreate
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Deployment complete!"
