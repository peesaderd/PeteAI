services:
  ai-orchestrator:
    build:
      context: ./packages/ai-orchestrator
      dockerfile: Dockerfile
    depends_on:
    - erp-core
    - redis
    environment:
    - ORCHESTRATOR_PORT=54516
    - ORCHESTRATOR_DB_PATH=/app/data/orchestrator.db
    - ERP_MCP_URL=http://erp-core:54510/api/mcp
    - AGENCY_API_URL=http://autonomous-agency:80
    - SIYUAN_URL=http://172.18.0.1:54511
    - SIYUAN_TOKEN=9w4oqxucqvq1o8sd
    - TASK_MANAGER_URL=http://task-manager:8081
    - AGENT_LOOP_ENABLED=true
    - REDIS_URL=redis://redis:6379
    - LLM_API_URL=https://api.deepseek.com
    - LLM_API_KEY=${DEEPSEEK_API_KEY}
    - LLM_MODEL=deepseek-chat
    - LLM_MAX_TOKENS=8192
    - LLM_TEMPERATURE=0.3
    - SUPERVISOR_INACTIVITY_TIMEOUT_MS=60000
    - SUPERVISOR_INACTIVITY_ALERT_TIMEOUT_MS=120000
    - SUPERVISOR_AUTO_PROMPT_ENABLED=true
    ports:
    - 54516:54516
    restart: unless-stopped
    volumes:
    - ./data:/app/data
  erp-core:
    build: .
    environment:
    - PORT=54510
    - ERP_CORE_URL=http://localhost:54510
    - NODE_ENV=production
    - SIYUAN_API_TOKEN=9w4oqxucqvq1o8sd
    ports:
    - 54510:54510
    restart: unless-stopped
    volumes:
    - ./data:/app/data
    - ./packages/web/dist:/app/packages/web/dist
  knowledge-base:
    build:
      context: .
      dockerfile: Dockerfile.knowledge-base
    environment:
    - PORT=3100
    - KB_DB_PATH=/app/data/knowledge-base.db
    - KB_DATA_DIR=/app/data/kb-files
    ports:
    - 54512:3100
    restart: unless-stopped
    volumes:
    - ./data:/app/data
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    restart: unless-stopped
    volumes:
    - redis-data:/data
  sync-siyuan:
    build:
      context: .
      dockerfile: Dockerfile.sync-siyuan
    depends_on:
    - knowledge-base
    environment:
    - SYNC_PORT=54513
    - SIYUAN_URL=http://siyuan:54511
    - SIYUAN_API_TOKEN=9w4oqxucqvq1o8sd
    - KB_URL=http://knowledge-base:3100
    - SYNC_INTERVAL=60000
    ports:
    - 54513:54513
    restart: unless-stopped
    volumes:
    - ./data:/app/data
  system-agent:
    build:
      context: ./packages/system-agent
      dockerfile: Dockerfile
    depends_on:
    - ai-orchestrator
    - redis
    environment:
    - SIYUAN_URL=http://siyuan:54511
    - SIYUAN_TOKEN=9w4oqxucqvq1o8sd
    - REPO_ROOT=/repo
    - SYSTEM_AGENT_PORT=54520
    - ORCHESTRATOR_URL=http://ai-orchestrator:54516
    - REDIS_URL=redis://redis:6379
    - LLM_API_URL=https://api.deepseek.com
    - LLM_API_KEY=${DEEPSEEK_API_KEY}
    - LLM_MODEL=deepseek-chat
    - LLM_MAX_TOKENS=8192
    - LLM_TEMPERATURE=0.3
    - SUPERVISOR_INACTIVITY_TIMEOUT_MS=60000
    - SUPERVISOR_INACTIVITY_ALERT_TIMEOUT_MS=120000
    - SUPERVISOR_AUTO_PROMPT_ENABLED=true
    ports:
    - 54520:54520
    restart: unless-stopped
    volumes:
    - ..:/repo:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - /root/.openhands:/root/.openhands:ro
    - ./packages/ai-orchestrator/.conversations:/conversations:ro
  task-manager:
    build:
      context: .
      dockerfile: Dockerfile.task-manager
    environment:
    - PORT=8081
    - TASK_MANAGER_DB_PATH=/app/data/task-manager.db
    ports:
    - 8082:8081
    restart: unless-stopped
    volumes:
    - ./data:/app/data
  # ── Monitoring & Observability ──────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    ports:
      - 54530:3100
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail.yml
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - 54531:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - 54532:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=true
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/erp-dashboard.json:/var/lib/grafana/dashboards/erp-dashboard.json
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.8.0
    command:
      - --path.rootfs=/host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    pid: host


volumes:
  redis-data: {}
  loki-data: {}
  prometheus-data: {}
  grafana-data: {}
