# ============================================================
# ERP Core + SiYuan — Docker Compose
# ============================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f            # Follow logs
#   docker compose down               # Stop all services
# ============================================================

services:
  # ==========================================================
  # SiYuan Note — Persistent Knowledge Base (笔记)
  # ==========================================================
  siyuan:
    image: b3log/siyuan:latest
    container_name: erp-siyuan
    restart: unless-stopped
    ports:
      - "54511:6806"
    volumes:
      - siyuan-data:/siyuan/workspace
    environment:
      - SIYUAN_AUTH_CODE=${SIYUAN_AUTH_CODE:-erp-core-2026}
      - SIYUAN_ACCESS_AUTH_CODE=${SIYUAN_AUTH_CODE:-erp-core-2026}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--header=Authorization: Bearer ${SIYUAN_AUTH_CODE:-erp-core-2026}", "http://localhost:6806/"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ==========================================================
  # ERP Core — All-in-One (PM2 managed)
  # ==========================================================
  erp-core:
    build: .
    container_name: erp-core
    restart: unless-stopped
    ports:
      - "3000:3000"      # ERP Server API
      - "3100:3100"      # Knowledge Base API
      - "54513:54513"    # SiYuan Sync Service
      - "54516:54516"    # AI Orchestrator
    volumes:
      - erp-server-data:/app/packages/server/data
      - erp-kb-data:/app/packages/knowledge-base/data
      - erp-sync-data:/app/packages/sync-siyuan/data
    environment:
      # ERP Server
      - PORT=3000
      - MODE=http
      - NODE_ENV=production
      - DB_PATH=/app/packages/server/data/erp.db
      - JWT_SECRET=${JWT_SECRET:-erp-core-jwt-secret-2026}
      - TENANT_ID=t_001

      # Knowledge Base
      - KB_PORT=3100
      - KB_DB_PATH=/app/packages/knowledge-base/data/kb.db

      # SiYuan Sync
      - SYNC_PORT=54513
      - SIYUAN_URL=http://siyuan:6806
      - SIYUAN_API_TOKEN=${SIYUAN_API_TOKEN:-}
      - KB_URL=http://localhost:3100
      - SYNC_INTERVAL=60000

      # AI Orchestrator
      - ORCHESTRATOR_PORT=54516
      - KB_URL_ORCH=http://localhost:3100
      - SIYUAN_URL_ORCH=http://siyuan:6806
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    depends_on:
      siyuan:
        condition: service_healthy

  # ==========================================================
  # Redis (for AI Orchestrator)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

# ============================================================
# Persistent Volumes
# ============================================================
volumes:
  siyuan-data:
    name: erp-siyuan-data
  erp-server-data:
    name: erp-server-data
  erp-kb-data:
    name: erp-kb-data
  erp-sync-data:
    name: erp-sync-data
  redis-data:
    name: erp-redis-data
