version: '3.8'

services:
  erp-core:
    build:
      context: ../../
      dockerfile: packages/infra/Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MODE=http
      - ERP_DB_PATH=/data/erp-core.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - erp-data:/data
    restart: unless-stopped

  knowledge-base:
    build:
      context: ../../
      dockerfile: packages/infra/Dockerfile.kb
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - MODE=http
      - KB_DB_PATH=/data/knowledge-base.db
      - KB_DATA_DIR=/data/kb-files
    volumes:
      - kb-data:/data
    restart: unless-stopped

  # Optional: Caddy reverse proxy with auto HTTPS
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      - erp-core
      - knowledge-base
    restart: unless-stopped

volumes:
  erp-data:
  kb-data:
  caddy-data:
