global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'erp-core'
    static_configs:
      - targets: ['erp-core:54510']
        labels:
          service: 'erp-core'

  - job_name: 'ai-orchestrator'
    static_configs:
      - targets: ['ai-orchestrator:54516']
        labels:
          service: 'ai-orchestrator'

  - job_name: 'knowledge-base'
    static_configs:
      - targets: ['knowledge-base:3100']
        labels:
          service: 'knowledge-base'

  - job_name: 'task-manager'
    static_configs:
      - targets: ['task-manager:8081']
        labels:
          service: 'task-manager'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
