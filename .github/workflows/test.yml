name: CI Test Pipeline

on:
  push:
    branches: [main, master, develop, erp-core]
  pull_request:
    branches: [main, master, develop, erp-core]

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage -- --reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  vision-tests:
    name: Vision Tests (DeepSeek)
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always() && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Vision UI Tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_URL: http://localhost:3000
        run: npx playwright test tests/vision/ --grep @visual

      - name: Upload Vision Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-test-report
          path: |
            playwright-report/
            tests/vision/results/
          retention-days: 7

  notify-failure:
    name: Notify on Failure
    needs: [unit-tests, e2e-tests, vision-tests]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create issue for test failure
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const workflowUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            if ('${{ needs.unit-tests.result }}' === 'failure') {
              failures.push('Unit Tests (Vitest)');
            }
            if ('${{ needs.e2e-tests.result }}' === 'failure') {
              failures.push('E2E Tests (Playwright)');
            }
            if ('${{ needs.vision-tests.result }}' === 'failure') {
              failures.push('Vision Tests (DeepSeek)');
            }

            if (failures.length > 0) {
              const body = `## ❌ CI Pipeline Failure\n\n### Failed Jobs:\n${failures.map(j => `- **${j}**`).join('\n')}\n\n### Workflow Run:\n${workflowUrl}\n\n### Branch:\n\`${{ github.ref_name }}\`\n\n### Commit:\n${{ github.sha }}\n\n---\n*Auto-created by CI pipeline on failure*`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[CI] Test pipeline failed on ${new Date().toISOString().split('T')[0]}`,
                labels: ['bug', 'test'],
                body: body
              });
            }
